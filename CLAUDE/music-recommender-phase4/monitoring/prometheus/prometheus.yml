global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development
    service: music-recommender

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "music-recommender-api"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  - job_name: "kafka"
    static_configs:
      - targets: ["kafka:9101"]
    scrape_interval: 30s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
